name = "dear-farmer"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

# Banco D1 (free tier: 5 GB, 5M leituras/dia, 100k escritas/dia).
# Crie com `npx wrangler d1 create dear-farmer` e cole o database_id aqui.
[[d1_databases]]
binding = "DB"
database_name = "dear-farmer"
database_id = "COLOQUE-O-ID-AQUI"

# Limpeza diária (cartas removidas há mais de 30 dias são apagadas de vez).
[triggers]
crons = ["17 4 * * *"]

# Rate limit por IP na borda (gratuito). Opcional: se remover o bloco, o Worker usa só o D1.
[[unsafe.bindings]]
name = "RL_IP"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 120, period = 60 }

[vars]
# Limites do servidor (o mod também limita 3 cartas por dia do jogo).
LETTERS_PER_HOUR   = "12"   # cartas por hora real, por jogador
LETTERS_PER_DAY    = "40"   # cartas por 24h reais, por jogador (rede de segurança)
LETTERS_PER_HOUR_IP = "30"  # cartas por hora real, por IP (vários jogadores na mesma casa)
VOTES_PER_HOUR     = "120"
MIN_BODY_LENGTH    = "10"
MAX_BODY_LENGTH    = "600"
MAX_NAME_LENGTH    = "24"
HIDE_SCORE         = "-5"   # score <= isso -> carta removida
HIDE_REPORTS       = "3"    # denúncias >= isso -> carta removida
MIN_SERVE_SCORE    = "-5"   # score < isso -> não aparece no feed. Mantenha >= HIDE_SCORE, senão a carta some antes de ser apagada
MAX_FEED_COUNT     = "20"
FEED_MAX_AGE_DAYS  = "180"  # cartas mais velhas que isso não entram no feed
PURGE_HIDDEN_AFTER_DAYS = "30"
MIN_CLIENT_VERSION = "1.0.0"
BLOCKED_WORDS      = ""     # lista separada por vírgula, opcional

# Segredos (NÃO coloque aqui; use `npx wrangler secret put NOME`):
#   SIGNING_SECRET  -> HMAC dos vote tokens + salt do hash de IP (obrigatório)
#   ADMIN_KEY       -> acesso aos endpoints /admin (opcional)
